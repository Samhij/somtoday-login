<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Voorbeeld</title>
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <h1>Voorbeeldplugin</h1>
    <p id="out">Laden…</p>
    <script>
      cyfers.getContext().then(function (ctx) {
        document.getElementById("out").textContent =
          "Hallo " + (ctx.students[0] && ctx.students[0].name ? ctx.students[0].name : "leerling") +
          " van " + ctx.schoolName + ".";
      }).catch(function (err) {
        document.getElementById("out").textContent = err.message;
      });
    </script>
  </body>
</html>
